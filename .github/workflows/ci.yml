name: deploy
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy static site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

# NOTE: The previous workflow built the MkDocs Material site (docs/ + mkdocs.yml; note: mkdocs builds into site/, hence the public/ name).
# That setup is retained in the repo for a future overhaul but is not deployed.
# To restore it, replace the deploy step with:
#   - uses: astral-sh/setup-uv@v5
#   - run: uv run mkdocs gh-deploy --force
